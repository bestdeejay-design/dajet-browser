<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;530;600&display=swap">
<style>
  :root {
    --paper: #15181c;
    --paper-deep: #101316;
    --ink: #f4f1e8;
    --muted: #aaa9a2;
    --accent: #e8ae8c;
    --line: rgba(244, 241, 232, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    width: 100%;
    height: 100%;
    padding: 40pt;
    display: grid;
    grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
    align-items: center;
    gap: 48px;
    background:
      radial-gradient(1200px 500px at 88% -10%, rgba(232, 174, 140, 0.09), transparent 60%),
      radial-gradient(900px 480px at -10% 110%, rgba(232, 174, 140, 0.05), transparent 55%),
      var(--paper);
  }
  .mark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--accent);
    margin-bottom: 34px;
  }
  .mark svg { width: 34px; height: 34px; }
  .mark span {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .eyebrow-rule { width: 34px; height: 1px; background: var(--accent); }
  h1 {
    font-size: 64px;
    font-weight: 530;
    letter-spacing: -0.055em;
    line-height: 0.99;
    margin-bottom: 20px;
  }
  h1 em { color: var(--accent); font-style: normal; }
  .description {
    max-width: 440px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 34px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--paper);
    font-size: 15.5px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 8px;
    text-decoration: none;
  }
  .cta svg { width: 18px; height: 18px; }
  .meta {
    margin-top: 26px;
    color: var(--muted);
    font-size: 13.5px;
    letter-spacing: 0.02em;
  }
  .figure { position: relative; }
  .figure-border {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--paper-deep);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  }
  .figure-tab {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .figure-tab span {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .figure img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <section class="hero">
    <div>
      <div class="mark">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M12.5 12.5H48C71.2 12.5 87.5 27.4 87.5 50S71.2 87.5 48 87.5H12.5V12.5Zm19 18.5v38H48c11.9 0 20.5-6.4 20.5-19S59.9 31 48 31H31.5Z"/>
        </svg>
        <span>Dajet</span>
      </div>
      <div class="eyebrow">
        <span class="eyebrow-rule" aria-hidden="true"></span>
        <span>A browser for macOS</span>
      </div>
      <h1>Silence,<br><em>styled.</em></h1>
      <p class="description">A lighter browser for macOS: a dark start page, local history, and no telemetry.</p>
      <a class="cta" href="https://bro.dajet.ru/Dajet.dmg">
        Download Dajet
        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 2.75v9.5m0 0 3.6-3.6M10 12.25l-3.6-3.6M4 14.75v2.5h12v-2.5"/></svg>
      </a>
      <p class="meta">macOS 14+ &nbsp;·&nbsp; Apple silicon &nbsp;·&nbsp; app ~7 MB &nbsp;·&nbsp; free</p>
    </div>
    <figure class="figure">
      <div class="figure-border">
        <div class="figure-tab">
          <span>A new tab</span>
          <span class="dot" aria-hidden="true"></span>
        </div>
        <img src="../docs/assets/start-screen.png" alt="" width="1600" height="1000">
      </div>
    </figure>
  </section>
</body>
</html>
